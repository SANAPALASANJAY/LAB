<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://b.zmtcdn.com/data/o2_assets/5376b760d3b12ca9af29fc8f4e1847e71717417610.png">
    <title>Zomato</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css2?family=Doto:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="zomato.css" />

</head>
<body>
    <div class="page">
        <div class="first">
            <div class="nav">
                <div class="left">
                    <a href="#">GetApp</a>
                </div>
                <div class="right">
                    <a href="#">Investor Relations</a>
                    <a href="#">Add Restraunt</a>
                    <a href="#">Login</a>
                    <a href="#">Sign up</a>
                </div>
            </div>
            <div class="search">
                <div class="zomato">
                    <img src="https://b.zmtcdn.com/web_assets/8313a97515fcb0447d2d77c276532a511583262271.png" class="high-res-image" alt="" role="presentation">
                </div>
                <div class="txt"><normal>Discover the best food & drinks in Vizag</normal></div>
                <div class="bottom">
                    <div class="searchbar">
                        <div class="loc-icon">
                            <i class="fa-solid fa-location-dot fa-lg" style="color: #ee9281;"></i>
                        </div>
                        <div class="location">
                            <select>
                                <option>Location</option>
                            </select>
                        </div>
                        <div class="sep"></div>
                        <div class="search-icon">
                            <i class="fa-solid fa-magnifying-glass fa-lg"></i>
                        </div>
                        <div class="srch">
                            <input type="text" placeholder="Search for a restraunt, cuisine or a dish">
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="second">
            <div class="card">
                <img src="food.jpg" class="card-img">
                <p>Order Food Online</p>
            </div>
            <div class="card">
                <img src="goout.jpeg" class="card-img">
                <p>Go out for a meal</p>
            </div>
            <div class="card">
                <img src="dj.jpg" class="card-img">
                <p>Night Life & Clubs</p>
            </div>
            <div class="card">
                <img src="zpro.jpg" class="card-img">
                <p>Zomato Pro</p>
            </div>
        </div>
    </div>
</body>
</html>
